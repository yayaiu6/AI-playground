<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahya Mahroof — ML/MLOps Engineer</title>
  <meta name="description" content="Yahya Mahroof – Machine Learning & MLOps Engineer. Building intelligent systems that learn, adapt, and scale.">
  <meta name="author" content="Yahya Mahroof">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body.loading-screen{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif}
    .loading-text{font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.15em}
  </style>
</head>
<body class="loading-screen">
  <div class="loading-text">Loading...</div>
  <script>
    (async function() {
      var TOTAL = 30;
      var STYLES = [
        '02-editorial','03-scrollytelling','05-monolith','06-radial-command',
        '07-split-screen','10-zine','13-cinematic','14-typographic',
        '15-bento-grid','17-timeline','18-depth-of-field','21-kinetic-type',
        '23-codex','24-mosaic','28-motion-graphics','29-continuous-line',
        '30-theater','33-gradient-wash','35-scroll-jacking','36-handmade',
        '37-filmstrip','38-system-arch','40-page-layout','41-newsmagazine',
        '42-context-layers','43-parallax-theater','44-binary-toggle',
        '45-card-stack','47-generative','48-risograph'
      ];

      var params = new URLSearchParams(location.search);
      var devMode = params.has('dev');
      var idx = -1;

      var styleParam = params.get('style');
      if (styleParam) {
        var n = parseInt(styleParam, 10);
        if (n >= 1 && n <= TOTAL) idx = n - 1;
      }

      if (idx === -1) {
        var used = [];
        try { used = JSON.parse(sessionStorage.getItem('usedStyles') || '[]'); } catch(e) {}
        var available = [];
        for (var i = 0; i < TOTAL; i++) {
          if (used.indexOf(i) === -1) available.push(i);
        }
        idx = available.length > 0
          ? available[Math.floor(Math.random() * available.length)]
          : Math.floor(Math.random() * TOTAL);
        used.push(idx);
        if (used.length > Math.floor(TOTAL * 0.8)) {
          used = used.slice(Math.floor(TOTAL * 0.3));
        }
        try { sessionStorage.setItem('usedStyles', JSON.stringify(used)); } catch(e) {}
      }

      var chosen = STYLES[idx];
      try { sessionStorage.setItem('currentStyle', String(idx + 1)); } catch(e) {}

      if (devMode) {
        document.body.className = '';
        document.body.style.cssText = 'background:#0a0a0a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0';
        document.body.innerHTML =
          '<div style="text-align:center;max-width:400px">' +
            '<p style="font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:#666;margin-bottom:12px">Dev Mode</p>' +
            '<p style="font-size:13px;color:#888;margin-bottom:4px">Style ' + (idx + 1) + ' / ' + TOTAL + '</p>' +
            '<p style="font-size:22px;font-weight:700;margin-bottom:20px;color:#fff">' + chosen + '</p>' +
            '<button onclick="try{sessionStorage.clear();}catch(e){}location.reload()" style="background:#1a1a1a;color:#ccc;border:1px solid #333;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px">Randomize</button>' +
          '</div>';
        return;
      }

      try {
        var resp = await fetch('/styles/' + chosen + '.html');
        if (!resp.ok) throw new Error('Failed to load style');
        var html = await resp.text();

        var doc = new DOMParser().parseFromString(html, 'text/html');

        /* ── Clean up old style-injected elements ── */
        document.querySelectorAll('[data-style-injected]').forEach(function(el) { el.remove(); });

        /* ── Update <title> ── */
        var newTitle = doc.querySelector('title');
        if (newTitle) document.title = newTitle.textContent;

        /* ── Copy meta tags ── */
        doc.querySelectorAll('meta').forEach(function(m) {
          var key = m.getAttribute('name') || m.getAttribute('property') || '';
          if (key) {
            var existing = document.querySelector('meta[' + (m.hasAttribute('name') ? 'name' : 'property') + '="' + key + '"]');
            if (existing) existing.setAttribute('content', m.getAttribute('content') || '');
            else document.head.appendChild(m.cloneNode(true));
          }
        });

        /* ── Inject <link> stylesheets ── */
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
          var href = link.getAttribute('href');
          if (href && !document.querySelector('link[href="' + href + '"]')) {
            var clone = link.cloneNode(true);
            clone.setAttribute('data-style-injected', '1');
            document.head.appendChild(clone);
          }
        });

        /* ── Inject Google Fonts links ── */
        doc.querySelectorAll('link[href*="fonts.googleapis.com"], link[href*="fonts.gstatic.com"]').forEach(function(link) {
          var href = link.getAttribute('href');
          if (href && !document.querySelector('link[href="' + href + '"]')) {
            var clone = link.cloneNode(true);
            clone.setAttribute('data-style-injected', '1');
            document.head.appendChild(clone);
          }
        });

        /* ── Inject <preconnect> links ── */
        doc.querySelectorAll('link[rel="preconnect"]').forEach(function(link) {
          var href = link.getAttribute('href');
          if (href && !document.querySelector('link[href="' + href + '"]')) {
            var clone = link.cloneNode(true);
            clone.setAttribute('data-style-injected', '1');
            document.head.appendChild(clone);
          }
        });

        /* ── Inject inline <style> blocks ── */
        doc.querySelectorAll('style').forEach(function(style) {
          var clone = style.cloneNode(true);
          clone.setAttribute('data-style-injected', '1');
          document.head.appendChild(clone);
        });

        /* ── Replace body content FIRST (before scripts) ── */
        document.body.className = '';
        document.body.removeAttribute('style');
        document.body.innerHTML = doc.body.innerHTML;

        /* ── Inject <script src="..."> (non-module, e.g. GSAP) ── */
        doc.querySelectorAll('script[src]:not([type="module"])').forEach(function(old) {
          var src = old.getAttribute('src');
          if (src && !document.querySelector('script[src="' + src + '"]')) {
            var s = document.createElement('script');
            s.src = src;
            s.setAttribute('data-style-injected', '1');
            document.head.appendChild(s);
          }
        });

        /* ── Inject <script type="module" src="..."> (e.g. firebase-ratings) ── */
        doc.querySelectorAll('script[type="module"][src]').forEach(function(old) {
          var src = old.getAttribute('src');
          if (src && !document.querySelector('script[type="module"][src="' + src + '"]')) {
            var s = document.createElement('script');
            s.type = 'module';
            s.src = src;
            s.setAttribute('data-style-injected', '1');
            document.head.appendChild(s);
          }
        });

        /* ── Inject inline <script> (non-module) — body now exists ── */
        doc.querySelectorAll('script:not([type="module"]):not([src])').forEach(function(old) {
          if (old.textContent.trim()) {
            var s = document.createElement('script');
            s.textContent = old.textContent;
            s.setAttribute('data-style-injected', '1');
            document.body.appendChild(s);
          }
        });

        /* ── Inject inline <script type="module"> via blob ── */
        doc.querySelectorAll('script[type="module"]:not([src])').forEach(function(old) {
          if (old.textContent.trim()) {
            var blob = new Blob([old.textContent], { type: 'application/javascript' });
            var url = URL.createObjectURL(blob);
            var s = document.createElement('script');
            s.type = 'module';
            s.src = url;
            s.setAttribute('data-style-injected', '1');
            document.body.appendChild(s);
          }
        });

      } catch (err) {
        console.error('[Router] Failed to load style:', err);
        document.body.className = '';
        document.body.style.cssText = 'background:#0a0a0a;color:#e0e0e0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0';
        document.body.innerHTML = '<div style="text-align:center"><p style="color:#ef4444;margin-bottom:8px">Failed to load style</p><p style="color:#666;font-size:13px">' + err.message + '</p><br><button onclick="sessionStorage.clear();location.reload()" style="background:#1a1a1a;color:#ccc;border:1px solid #333;padding:8px 18px;border-radius:6px;cursor:pointer">Try Again</button></div>';
      }
    })();
  </script>
</body>
</html>
